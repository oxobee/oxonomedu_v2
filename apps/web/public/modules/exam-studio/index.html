    <style>
      /* Oxonom Edu Brand Identity & Design System */

        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;

        --brand-royal-orchid: #8D49A6 !important;

        /* Açık Yüzey Renkleri */

        --border-strong: #D5C5DC !important;
        --ring-primary: #D914C8 !important;
        --ring-primary-strong: #8D49A6 !important;

        /* Metin Renkleri */
        --text-primary: #241329 !important;
        --text-secondary: #514458 !important;
        --text-tertiary: #716779 !important;
        --text-muted: #716779 !important;

        /* Sidebar & Koyu Tema Renkleri */
        --bg-sidebar: #241329 !important;

        /* Fonksiyonel Renkler */
        --success-color: #16805D !important;

        --warning-color: #B86B00 !important;

      /* Gizli Çerez Banner'ı */

      /* Üst Bar (Topbar) - Oxonom Edu Koyu Premium Gradyan */
      .ts-topbar {

      /* ========================================================
         ÖZEL OXONOM EDU YAN MENÜ (SIDEBAR) TASARIMI
         ======================================================== */

      /* Metrik Kartları */

      /* Sayı Değerleri */
      .sidebar-stat-value {

        font-weight: 600 !important;
        letter-spacing: 0.02em !important;

      /* Renkli Kart Çizgileri ve Işık Efektleri */
      .sidebar-stat-item:nth-child(1) .sidebar-stat-value {

      .sidebar-stat-item:nth-child(1)::after {

        position: absolute;

      .sidebar-stat-item:nth-child(3) .sidebar-stat-value {

      .oxonom-card-tag {

        font-size: 10px;
        font-weight: 700;

      .oxonom-card-title {

      }
      .oxonom-card-desc {

        font-size: 11.5px;

      .oxonom-card-progress {

      /* Alt Eylemler Alanı (SORU EKLE & TEST HAZIRLA) */

      .dash-sidebar button[title*="taslak"] {

         DİZGİ MASASI (LAYOUT DESK) KURUMSAL RENK VE STİL GELİŞTİRMELERİ
         ======================================================== */

      div[style*="width: 280px"],

      div[style*="background: #1e293b"],

      /* ── 3. ELASTİK ANİMASYONLU YAN MENÜ (AÇILIP KAPANABİLİR) ── */

        function modernizeHamburgerIcon() {
          const hamburger = document.querySelector(".ts-topbar-hamburger");
          if (hamburger && !hamburger.dataset.modernized) {
            hamburger.dataset.modernized = "true";
            hamburger.innerHTML = `
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="18" x="3" y="3" rx="3.5"/>
                <path d="M9 3v18"/>
                <circle cx="6" cy="7" r="0.8" fill="currentColor"/>
                <circle cx="6" cy="12" r="0.8" fill="currentColor"/>
                <circle cx="6" cy="17" r="0.8" fill="currentColor"/>
              </svg>
            `;
            hamburger.title = "Menüyü Aç / Kapat";

            hamburger.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              const sidebar = document.querySelector(".dash-sidebar");
              if (!sidebar) return;
              sidebar.classList.toggle("oxonom-sidebar-open");

              // Mobilde backdrop yönetimi
              if (window.innerWidth <= 768) {
                let backdrop = document.querySelector(".oxonom-mobile-backdrop");
                if (sidebar.classList.contains("oxonom-sidebar-open")) {
                  if (!backdrop) {
                    backdrop = document.createElement("div");
                    backdrop.className = "oxonom-mobile-backdrop";
                    backdrop.addEventListener("click", () => {
                      sidebar.classList.remove("oxonom-sidebar-open");
                      backdrop.remove();
                    });
                    document.body.appendChild(backdrop);
                  }
                } else if (backdrop) {
                  backdrop.remove();
                }
              }
            }, true);
          }
        }
        setInterval(modernizeHamburgerIcon, 300);

        // 2. Buton Metinlerini oxonom-btn-text Span'ı ile Güvenle Sar
        function cleanSidebarButtons() {
          const sidebar = document.querySelector(".dash-sidebar");
          if (!sidebar) return;

          const buttons = sidebar.querySelectorAll("button, label");
          buttons.forEach((btn) => {
            const txt = (btn.textContent || "").trim();
            if (txt && !btn.title) {
              btn.title = txt;
            }
            if (txt.includes("Tarama")) {
              btn.title = "Tarama Başlat";
            } else if (txt.includes("Dizgi")) {
              btn.title = "Dizgi Masası";
            } else if (txt.includes("PDF")) {
              btn.title = "PDF & Görsel Kırp";
            } else if (txt.includes("Görsel")) {
              btn.title = "Görsel Yükle";
            } else if (txt.includes("Taslak")) {
              btn.title = "Taslak Yükle";
            }

            Array.from(btn.childNodes).forEach((node) => {
              if (node.nodeType === Node.TEXT_NODE && node.nodeValue.trim()) {
                const span = document.createElement("span");
                span.className = "oxonom-btn-text";
                span.textContent = node.nodeValue;
                node.parentNode.replaceChild(span, node);
              }
            });
          });
        }
        setInterval(cleanSidebarButtons, 500);
